version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: trademan_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: trademan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trademan_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trademan.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    name: trademan_postgres_data
