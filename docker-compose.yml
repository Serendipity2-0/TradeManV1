version: '3.9'

services:

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    env_file:
      - keycloak.env
    volumes:
      - C:\Users\srija\Dev\Trademan_docker\postgres_data\data:/var/lib/postgresql/data



  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on: 
      - db

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start
    restart: always
    env_file:
      - keycloak.env
    environment:
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HEALTH_ENABLED: true
    ports:
      - 8081:8080
    depends_on:
      - db

